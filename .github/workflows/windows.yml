name: Windows CI
on: [push, pull_request]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    name: MSYS2 UCRT64
    steps:

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        pacboy: >-
          diffutils:
          gcc:p
          meson:p
          pkgconf:p
          libpng:p
          asciidoctor:p

    - name: Checkout
      uses: actions/checkout@v7

    - name: Build
      run: |
        meson --buildtype=release build
        ninja -C build

    - name: Test
      run: ninja -C build test

    - name: Create artifacts
      run: |
        mkdir artifacts
        cp build/*.exe artifacts/
        rm artifacts/*_tests.exe
        strip artifacts/*.exe
        cp misc/*.bat artifacts/
        cp COPYING CHANGELOG.md README.md artifacts/
        mkdir artifacts/docs
        cp build/*.html artifacts/docs
        mkdir artifacts/docs/image
        cp docs/image/* artifacts/docs/image

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: xsys35c-64bit
        path: artifacts
